name: Build and Publish PDFs

on:
  push:
    branches: [ "main" ]

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder:
          - resume
          - quick-note
          - presentation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ matrix.folder }}.tex
          working_directory: ${{ matrix.folder }}

      - name: Upload temporary PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ matrix.folder }}
          path: ${{ matrix.folder }}/${{ matrix.folder }}.pdf
          if-no-files-found: error

  publish:
    needs: compile
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download resume PDF
        uses: actions/download-artifact@v4
        with:
          name: pdf-resume
          path: output/

      - name: Download quick-note PDF
        uses: actions/download-artifact@v4
        with:
          name: pdf-quick-note
          path: output/

      - name: Download presentation PDF
        uses: actions/download-artifact@v4
        with:
          name: pdf-presentation
          path: output/

      - name: Commit and push PDFs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update compiled LaTeX PDFs [skip ci]"
          file_pattern: "output/*.pdf"
