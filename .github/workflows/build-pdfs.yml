name: Build and Publish PDFs

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'output/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder:
          - resume
          - quick-note
          - presentation
          - poster

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ matrix.folder }}.tex
          working_directory: ${{ matrix.folder }}

      - name: Upload temporary PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ matrix.folder }}
          path: ${{ matrix.folder }}/${{ matrix.folder }}.pdf
          if-no-files-found: error

  publish:
    needs: compile
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all compiled PDFs
        uses: actions/download-artifact@v4
        with:
          pattern: pdf-*
          path: output/
          merge-multiple: true

      - name: Create Pull Request with PDFs
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Auto-update compiled LaTeX PDFs"
          title: "Update compiled LaTeX PDFs"
          body: "This PR automatically updates the compiled LaTeX PDFs."
          branch: "update-pdfs"
          base: "main"
